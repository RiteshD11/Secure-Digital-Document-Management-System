<svg width="100%" height="100%" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Faint Ashoka Chakra Pattern -->
    <pattern id="chakra" width="200" height="200" patternUnits="userSpaceOnUse" x="100%" y="50%" viewBox="-100 -100 200 200">
      <circle cx="0" cy="0" r="90" fill="none" stroke="#1e457f" stroke-width="4" opacity="0.08" />
      <circle cx="0" cy="0" r="70" fill="none" stroke="#1e457f" stroke-width="2" opacity="0.08" />
      <path d="M0,-90 L0,90 M-90,0 L90,0 M-63,-63 L63,63 M-63,63 L63,-63 M-34,-83 L34,83 M-34,83 L34,-83 M-83,-34 L83,34 M-83,34 L83,-34" stroke="#1e457f" stroke-width="2" opacity="0.08" />
    </pattern>
  </defs>
  
  <!-- Base Background -->
  <rect width="100%" height="100%" fill="#f4f7fb" />
  
  <!-- Faint Chakra on the right -->
  <rect width="100%" height="100%" fill="url(#chakra)" transform="translate(-100, 0)" />
  
  <!-- Left Tricolor Wave -->
  <path d="M0,100 C150,100 250,50 350,150 L0,150 Z" fill="#138808" opacity="0.8" />
  <path d="M0,90 C150,90 250,40 350,150 L0,150 Z" fill="#ffffff" opacity="0.9" />
  <path d="M0,80 C150,80 250,30 350,150 L0,150 Z" fill="#FF9933" opacity="0.8" />
  
  <!-- Right Tricolor Wave -->
  <path d="M100%,100 Ccalc(100% - 150),100 calc(100% - 250),50 calc(100% - 350),150 L100%,150 Z" fill="#138808" opacity="0.8" />
  <path d="M100%,90 Ccalc(100% - 150),90 calc(100% - 250),40 calc(100% - 350),150 L100%,150 Z" fill="#ffffff" opacity="0.9" />
  <path d="M100%,80 Ccalc(100% - 150),80 calc(100% - 250),30 calc(100% - 350),150 L100%,150 Z" fill="#FF9933" opacity="0.8" />
</svg>
