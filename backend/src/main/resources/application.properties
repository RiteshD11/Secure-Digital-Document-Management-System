spring.application.name=backend

spring.config.import=optional:application-secret.properties

spring.datasource.url=${databaseurl}
spring.datasource.username=${databaseusername}
spring.datasource.password=${databasepassword}

jwt.secretKey=${jwtSecretKey}

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:${mailUsername}}
spring.mail.password=${MAIL_PASSWORD:${mailPassword}}
spring.mail.properties.mail.smtp.from=${MAIL_FROM:${mailFrom:${spring.mail.username}}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.main.allow-circular-references=true

# MinIO S3 Object Storage Configuration
dms.storage.type=minio
dms.minio.endpoint=${minioUrl:http://localhost:9000}
dms.minio.accessKey=${minioUsername:minioadmin}
dms.minio.secretKey=${minioPassword:minioadmin}
dms.minio.bucketName=${minioBucketName:secure-dms-documents}
dms.minio.quarantineBucket=secure-dms-quarantine
dms.minio.enabled=true

# FastAPI AI/ML & Biometrics Microservice Configuration
fastapi.base.url=http://16.171.132.80:8000
fastapi.api.key=${fastapiApiKey:}
fastapi.connect.timeout-ms=5000
fastapi.read.timeout-ms=15000

